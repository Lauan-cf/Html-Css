<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim de Notas</title>
    <style>
        body
        {
            font-family: Arial, Helvetica, sans-serif;
        }
        table 
        {
            border-collapse: collapse;
        }
        th, td
        {
            border: 2px solid rgb(0, 0, 0);
            padding: 10px;
            text-align: center;
        }
        th, .media
        {
            color: white;
            font-weight: bold;
            background-color: #545754;
        }
        .linha
        {
            font-weight: bold;
            color: black;
            background-color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col" rowspan="2">Área</th>
                <th scope="col" rowspan="2">Disciplina</th>
                <th scope="colgroup" colspan="2">Notas</th>
                <th scope="col" rowspan="2">Média</th>
                
            </tr>
            <tr> 
                <th scope="col">Nota1</th>
                <th scope="col">Nota2</th>
              
            </tr>
            <tr>
                
            </tr>
        </thead>
        <tbody>
            
            <tr>
                <th class="linha" rowspan="4">Exatas</th>
                <td>Matemática</td>
               
                <td>8.5</td>
                <td>9.7</td>
                <td>9.1</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>7.0</td>
                <td>4.2</td>
                <td>5.6</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>8.0</td>
                <td>10.0</td>
                <td>9.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>5.9</td>
                <td>7.8</td>
                <td>6.85</td>
            </tr>
            <tr>
            <th colspan="4">Média de Exatas</th>
            <td class="media">7.64</td>
        </tr>
            <tr>
                <th class="linha" rowspan="2">Humanas</th>
                <td>História</td>
                <td>10.0</td>
                <td>8.6</td>
                <td>9.3</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>3.0</td>
                <td>6.2</td>
                <td>4.6</td>
            </tr>
            <tfoot>
                <tr>
                    <th colspan="4">Média de Humanas</th>
                    <td class="media">6.95</td>
                </tr>
            </tfoot>
        </tbody>
        
        
    </table>
</body>
</html>
