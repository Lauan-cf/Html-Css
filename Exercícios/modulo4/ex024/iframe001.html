<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        #a
        {
            height: 400px; /*css é soberano na escolha das configurações visuais*/
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        <!-- Tamanho padrão 300x150 -->
        Acessando o site do <iframe src="https://www.cursoemvideo.com" frameborder="333"> <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a></iframe> <!--Quando é colocado uma segunda arg no iframe, ele só será exibido se o navegador do usuário não for compratível com o uso das mesmas -->
    </p>
    <p>
        O site do <iframe src="https://www.google.com/" frameborder="0">    </iframe> e alguns outros não conseguem aparecer pois eles tem proteção contra o uso de iframes com eles
    </p>
    <p>Também há como configurar seu tamanho</p>
    <p>Cs50 (repositório do guanabara n quis aparecer) <iframe src="https://ead.estudar.org.br/c/cc50-o-curso-de-ciencia-da-computacao-de-harvard-no-brasil/sections/196917/lessons/733465" frameborder="0" height="500" width="700"> no<a href="https://ead.estudar.org.br/c/cc50-o-curso-de-ciencia-da-computacao-de-harvard-no-brasil/sections/196917/lessons/733465" target="_blank" id="a" scrolling="no">Github</a></iframe ></p>
</body>
</html>
