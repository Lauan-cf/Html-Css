<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="shortcut icon" href="logo-html-css-arrendodado-que-desbuga1 copy.ico" type="image/x-icon">
    <style>
        *
        {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu Primeiro Formulário</h1>
    <form action="cadastro.php" autocomplete="off" method="Post">  <!-- GET e POST são os dois métodos, GET faz com que apareça o que você digitou na url, POST não-->  
        <label for="inome">Nome: <input type="text" name="nome" id="inome"></label>
        <label for="isobrenome">Sobrenome: <input type="text" name="sobrenome" id="isobrenome"></label>
        <label><input type="submit" value="Enviar"></label>
    </form>
</body>
