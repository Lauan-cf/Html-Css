<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="shortcut icon" href="logo-html-css-arrendodado-que-desbuga1 copy.ico" type="image/x-icon">
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>
                Dados Pessoais
            </legend>
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="5">
            </p>
            <p>
                <label for="iemail">Email: </label>
                <input type="email" name="email" id="iemail" required>
            </p>
            <p>
                <label for="itel">Telefone: </label>                                         <!--Só aceita 4 digitos, traço, 4 digitos-->
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(\d{2}-\)\d{4}-[0-9]{4}$" required placeholder="(xx) xxxx-xxxx"> <!--\d e [0-9] para digitos-->
            </p>                                                                  <!--Obrigatório DDD-->
            <!--Estudar mais sobre RegEx-->
            <p>
                <input type="submit" value="Enviar:">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
