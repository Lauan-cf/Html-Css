<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container
        {
            display: flex;
            background-color: lightsalmon;
            flex-flow: row nowrap;
            
        }

        div.item
        {
            background-color: lightgreen;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }
        /* Ordem no video original: i7(G), i2(B), i1(A), i6(F), i5(E), i3(C), i4(D) 
           Ordem no meu: i7(G), i5(E), i3(C), i6(F), i2(B), i1(A), i4(D)
        */
        div#i1
        {
            order: 4;
        }

        div#i2
        {
            order: 2;
        }

        div#i3
        {
            order: -1;
        }

        div#i4
        {
            order: 5;
        }

        div#i5
        {
            order: -3;
        }
        
        div#i6
        {
            order: -1;
        }

        div#i7
        {
            order: -4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
