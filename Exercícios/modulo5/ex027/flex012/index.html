<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container
        {
            display: flex;
            background-color: lightsalmon;
            flex-flow: row nowrap;
           
            
        }

        div.item
        {
            background-color: lightgreen;
            border: 1px solid black;
            text-align: center;
            
        }

        #cxA
        {
            /* flex-grow: 3;
            flex-shrink: 1;
            flex-basis: 250px; */
            flex: 3 1 250px;
        }
        
        #cxB
        {
            /* flex-grow: 0;
            flex-shrink: 0;
            flex-basis: 250px; */
            flex: 0 0 250px;
        }

        #cxC
        {
            /* flex-grow: 1;
            flex-shrink: 3;
            flex-basis: 250px; */
            flex: 1 3 250px;
            /* flex: 0 1 auto e flex: initial são as configurações base
               flex: 0 0 auto e flex none são nada flexíveis
               flex: 1 1 auto e flex: auto são completamente flexíveis */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
