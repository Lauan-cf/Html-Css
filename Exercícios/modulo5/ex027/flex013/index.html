<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        *
        {
            margin: 0;
        }
        header
        {
            display: flex;
            background-color: #515152;
            padding: 20px;
            justify-content: space-between;
            flex-flow: row wrap;
        }

        h1
        {
            font-size: 4rem;
        }

        nav
        {
            background-color: black;
            color: white;
            flex: none;
            border-radius: 20px;
            gap: 100px;
        }



    </style>
</head>
<body>
    <header>
        <h1>Meu site</h1>
        <nav>Opção 1</nav>
        <nav>Opção 2</nav>
        <nav>Opção 3</nav>
        <nav>Opção 4</nav>
        <nav>Opção 5</nav>
        <nav>Opção 6</nav>
    </header>
</body>
</html>
