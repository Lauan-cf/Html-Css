<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        *
        {
            margin: 0;
        }
        header
        {
            display: flex;
            background-color: #515152;
            padding: 20px;
            justify-content: flex-start;
            flex-flow: row wrap;
            gap: 850px;
        }

        h1
        {
            font-size: 4rem;
            color: white;
            text-shadow: 1px 2px 5px black;
        }

        #navbar
        {
            display: flex;
            height: 100px;
            gap: 10px;
            align-items: center;
        }

        nav
        {
            background-color: black;
            color: white;
            flex: none;
            border-radius: 10px;
            padding: 10px;
            flex-basis: 100px;
            height: 40px;
            font-size: 1.5rem;
            text-align: center;
        }



    </style>
</head>
<body>
    <header>
        <h1>Meu Site</h1>
        <div id="navbar">
            <nav>Opção 1</nav>
            <nav>Opção 2</nav>
            <nav>Opção 3</nav>
            <nav>Opção 4</nav>
            <nav>Opção 5</nav>
            <nav>Opção 6</nav>
        </div>
    </header>
</body>
</html>
